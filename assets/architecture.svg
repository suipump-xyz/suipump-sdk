  </g>

  <!-- Side flow labels -->
  <text x="28" y="175" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#3B82F6" class="f1">⬇ REST</text>
  <text x="28" y="290" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#10B981" class="f2">⬇ PTB Bytes</text>
  <text x="28" y="405" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#A78BFA" class="f3">⬇ Events</text>
</svg>