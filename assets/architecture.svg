    @keyframes arrowFlow{to{stroke-dashoffset:-24}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    .arrow-line{stroke-dasharray:8 6;animation:arrowFlow .8s linear infinite}
    .pulse-text{animation:pulse 2.5s ease-in-out infinite}
