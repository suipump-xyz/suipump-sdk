<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="layer-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1020"/>
    </linearGradient>
    <linearGradient id="layer-sdk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1A12"/>
      <stop offset="100%" stop-color="#0D1015"/>
    </linearGradient>
    <linearGradient id="layer-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A28"/>
      <stop offset="100%" stop-color="#0F0A18"/>
    </linearGradient>
    <linearGradient id="layer-chain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1A1A"/>
      <stop offset="100%" stop-color="#080E0E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    <![CDATA[
    @keyframes flowDown { 0%,100%{opacity:.6} 50%{opacity:1} }
    @keyframes flowRight { to{stroke-dashoffset:-20} }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes glow { 0%,100%{opacity:.3} 50%{opacity:.7} }
    .f1{animation:flowDown 2.5s ease-in-out infinite}
    .f2{animation:flowDown 2.5s ease-in-out .6s infinite}
    .f3{animation:flowDown 2.5s ease-in-out 1.2s infinite}
    .f4{animation:flowDown 2.5s ease-in-out 1.8s infinite}
    .arrow{stroke-dasharray:6 4;animation:flowRight .8s linear infinite}
    .glow{animation:glow 2s ease-in-out infinite}
    .card{transition:all .2s}
    .card:hover{filter:brightness(1.3)}
    ]]>
  </style>

  <rect width="1200" height="560" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent)" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="22" font-weight="700" fill="#10B981" letter-spacing="1">🏗️ System Architecture</text>
  <text x="600" y="58" text-anchor="middle"
        font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#4A5568">
    End-to-end data flow · SDK → API → Blockchain</text>

  <!-- ====== LAYER 1: Frontend ====== -->
  <g transform="translate(0, 75)">
    <rect x="40" y="0" width="1120" height="100" rx="8" fill="url(#layer-front)" stroke="#1A2744" stroke-width="1"/>
    <rect x="40" y="0" width="1120" height="2.5" fill="#3B82F6" opacity="0.5"/>

    <text x="60" y="24" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#60A5FA">🖥️ FRONTEND</text>

    <!-- Cards -->
    <rect x="60" y="36" width="180" height="48" rx="6" fill="#0F1D3D" stroke="#1E3A6A" stroke-width="0.8" class="card"/>
    <text x="105" y="57" font-family="system-ui,sans-serif" font-size="11" fill="#93C5FD">⚛️ React dApp</text>
    <text x="105" y="73" font-family="'SF Mono',monospace" font-size="9" fill="#3B5A8A">Next.js · Wallet Connector</text>

    <rect x="260" y="36" width="180" height="48" rx="6" fill="#0F1D3D" stroke="#1E3A6A" stroke-width="0.8" class="card"/>
    <text x="305" y="57" font-family="system-ui,sans-serif" font-size="11" fill="#93C5FD">📱 CLI / Script</text>
    <text x="305" y="73" font-family="'SF Mono',monospace" font-size="9" fill="#3B5A8A">Automation · Batch Ops</text>

    <rect x="460" y="36" width="180" height="48" rx="6" fill="#0F1D3D" stroke="#1E3A6A" stroke-width="0.8" class="card"/>
    <text x="505" y="57" font-family="system-ui,sans-serif" font-size="11" fill="#93C5FD">🤖 Telegram Bot</text>
    <text x="505" y="73" font-family="'SF Mono',monospace" font-size="9" fill="#3B5A8A">grammY · Trade Alerts</text>

    <rect x="660" y="36" width="180" height="48" rx="6" fill="#0F1D3D" stroke="#1E3A6A" stroke-width="0.8" class="card"/>
    <text x="705" y="57" font-family="system-ui,sans-serif" font-size="11" fill="#93C5FD">🔐 zkLogin</text>
    <text x="705" y="73" font-family="'SF Mono',monospace" font-size="9" fill="#3B5A8A">Enoki · Google Sign-In</text>

    <!-- Down arrow -->
    <line x1="600" y1="90" x2="600" y2="108" stroke="#3B82F6" stroke-width="1.5" class="arrow" opacity="0.7"/>
    <polygon points="596,106 600,114 604,106" fill="#3B82F6" opacity="0.7"/>
  </g>

  <!-- ====== LAYER 2: SDK ====== -->
  <g transform="translate(0, 188)">
    <rect x="40" y="0" width="1120" height="100" rx="8" fill="url(#layer-sdk)" stroke="#0A2A1A" stroke-width="1"/>
    <rect x="40" y="0" width="1120" height="2.5" fill="#10B981" opacity="0.5"/>

    <text x="60" y="24" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#34D399">📦 SDK <tspan fill="#4A5568" font-size="9">(8 modules · 19 exported types)</tspan></text>

    <!-- SDK sub-client cards -->
    <rect x="60" y="36" width="120" height="48" rx="6" fill="#0A1F14" stroke="#0D3D24" stroke-width="0.8" class="card"/>
    <text x="80" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#6EE7B7">🪙 Tokens</text>
    <text x="80" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">get/list/buy/sell</text>

    <rect x="195" y="36" width="120" height="48" rx="6" fill="#0A1F14" stroke="#0D3D24" stroke-width="0.8" class="card"/>
    <text x="215" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#6EE7B7">📊 Portfolio</text>
    <text x="215" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">holdings/trades</text>

    <rect x="330" y="36" width="120" height="48" rx="6" fill="#0A1F14" stroke="#0D3D24" stroke-width="0.8" class="card"/>
    <text x="350" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#6EE7B7">🤖 Agent</text>
    <text x="350" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">batch/copy-trade</text>

    <rect x="465" y="36" width="120" height="48" rx="6" fill="#0A1F14" stroke="#0D3D24" stroke-width="0.8" class="card"/>
    <text x="485" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#6EE7B7">🌊 Stream</text>
    <text x="485" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">WebSocket events</text>

    <rect x="600" y="36" width="120" height="48" rx="6" fill="#0A1F14" stroke="#0D3D24" stroke-width="0.8" class="card"/>
    <text x="620" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#6EE7B7">🖼️ Media</text>
    <text x="620" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">Walrus upload</text>

    <!-- SDK icon -->
    <rect x="780" y="36" width="160" height="48" rx="6" fill="#0F1F14" stroke="#10B981" stroke-width="0.8" class="card"/>
    <text x="800" y="55" font-family="'SF Mono',monospace" font-size="10" fill="#10B981">@suipump/sdk</text>
    <text x="800" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#3A6A4A">SuiGrpcClient wrapper</text>

    <!-- Down arrow -->
    <line x1="600" y1="90" x2="600" y2="108" stroke="#10B981" stroke-width="1.5" class="arrow" opacity="0.7"/>
    <polygon points="596,106 600,114 604,106" fill="#10B981" opacity="0.7"/>
  </g>

