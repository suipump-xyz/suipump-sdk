<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sui" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-sdk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">SuiPump SDK Architecture</text>
  <line x1="150" y1="45" x2="750" y2="45" stroke="#334155" stroke-width="1"/>

  <!-- Layer 1: Your Application -->
  <rect x="40" y="65" width="820" height="90" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="88" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">YOUR APPLICATION</text>

  <rect x="65" y="100" width="160" height="40" rx="6" fill="url(#app)" filter="url(#shadow)"/>
  <text x="145" y="125" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Frontend DApp</text>

  <rect x="255" y="100" width="160" height="40" rx="6" fill="url(#app)" filter="url(#shadow)"/>
  <text x="335" y="125" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Backend Service</text>

  <rect x="445" y="100" width="160" height="40" rx="6" fill="url(#app)" filter="url(#shadow)"/>
  <text x="525" y="125" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Telegram Bot</text>

  <rect x="635" y="100" width="160" height="40" rx="6" fill="url(#app)" filter="url(#shadow)"/>
  <text x="715" y="125" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">CLI Script</text>

  <!-- Down arrows from apps -->
  <line x1="145" y1="140" x2="145" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="140" x2="335" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="525" y1="140" x2="525" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="140" x2="715" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: SDK -->
  <rect x="40" y="180" width="820" height="200" rx="8" fill="url(#sdk)" fill-opacity="0.1" stroke="url(#sdk)" stroke-width="2"/>
  <text x="60" y="203" fill="#a78bfa" font-size="11" font-weight="600" letter-spacing="1">@SUIPUMP/SDK</text>

  <!-- SDK Clients -->
  <rect x="65" y="215" width="145" height="55" rx="6" fill="#2d1b69" stroke="#7c3aed" stroke-width="1" filter="url(#shadow)"/>
  <text x="137" y="237" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">TokensClient</text>
  <text x="137" y="255" text-anchor="middle" fill="#8b5cf6" font-size="10">get · list · buy · sell</text>

  <rect x="230" y="215" width="145" height="55" rx="6" fill="#2d1b69" stroke="#7c3aed" stroke-width="1" filter="url(#shadow)"/>
  <text x="302" y="237" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">PortfolioClient</text>
  <text x="302" y="255" text-anchor="middle" fill="#8b5cf6" font-size="10">holdings · trades</text>

  <rect x="395" y="215" width="145" height="55" rx="6" fill="#2d1b69" stroke="#7c3aed" stroke-width="1" filter="url(#shadow)"/>
  <text x="467" y="237" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">AgentClient</text>
  <text x="467" y="255" text-anchor="middle" fill="#8b5cf6" font-size="10">batch · copy trade</text>

  <rect x="560" y="215" width="145" height="55" rx="6" fill="#2d1b69" stroke="#7c3aed" stroke-width="1" filter="url(#shadow)"/>
  <text x="632" y="237" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">StreamClient</text>
  <text x="632" y="255" text-anchor="middle" fill="#8b5cf6" font-size="10">events · WebSocket</text>

  <rect x="725" y="215" width="120" height="55" rx="6" fill="#2d1b69" stroke="#7c3aed" stroke-width="1" filter="url(#shadow)"/>
  <text x="785" y="237" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">MediaClient</text>
  <text x="785" y="255" text-anchor="middle" fill="#8b5cf6" font-size="10">upload · getUrl</text>

  <!-- SuiPump Class (center) -->
  <rect x="300" y="290" width="300" height="50" rx="25" fill="url(#sdk)" filter="url(#shadow)"/>
  <text x="450" y="320" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">SuiPump Class (Main Entry)</text>

  <!-- Lines from clients to SuiPump -->
  <line x1="137" y1="270" x2="350" y2="290" stroke="#6d28d9" stroke-width="1" marker-end="url(#arrow-sdk)"/>
  <line x1="302" y1="270" x2="380" y2="290" stroke="#6d28d9" stroke-width="1" marker-end="url(#arrow-sdk)"/>
  <line x1="467" y1="270" x2="430" y2="290" stroke="#6d28d9" stroke-width="1" marker-end="url(#arrow-sdk)"/>
  <line x1="560" y1="270" x2="480" y2="290" stroke="#6d28d9" stroke-width="1" marker-end="url(#arrow-sdk)"/>
  <line x1="725" y1="242" x2="550" y2="290" stroke="#6d28d9" stroke-width="1" marker-end="url(#arrow-sdk)"/>

  <!-- Down arrow from SDK -->
  <line x1="450" y1="340" x2="450" y2="405" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-sdk)"/>

  <!-- Layer 3: Backend API -->
  <rect x="40" y="410" width="820" height="90" rx="8" fill="url(#backend)" fill-opacity="0.1" stroke="url(#backend)" stroke-width="2"/>
  <text x="60" y="433" fill="#14b8a6" font-size="11" font-weight="600" letter-spacing="1">BACKEND API LAYER</text>

  <rect x="65" y="445" width="240" height="40" rx="6" fill="#0d3d3a" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="185" y="470" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="600">REST API (Express)</text>

  <rect x="330" y="445" width="240" height="40" rx="6" fill="#0d3d3a" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="470" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="600">WebSocket Server</text>

  <rect x="595" y="445" width="250" height="40" rx="6" fill="#0d3d3a" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="720" y="470" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="600">Indexer + Event Processor</text>

  <!-- Down arrow from Backend -->
  <line x1="450" y1="500" x2="450" y2="535" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Sui Blockchain -->
  <rect x="40" y="540" width="820" height="90" rx="8" fill="url(#sui)" fill-opacity="0.1" stroke="url(#sui)" stroke-width="2"/>
  <text x="60" y="563" fill="#22d3ee" font-size="11" font-weight="600" letter-spacing="1">SUI BLOCKCHAIN</text>

  <rect x="65" y="575" width="180" height="40" rx="6" fill="#0e3f4a" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="600" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">Bonding Curve</text>

  <rect x="265" y="575" width="180" height="40" rx="6" fill="#0e3f4a" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="355" y="600" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">Factory</text>

  <rect x="465" y="575" width="180" height="40" rx="6" fill="#0e3f4a" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="555" y="600" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">Graduation</text>

  <rect x="665" y="575" width="180" height="40" rx="6" fill="#0e3f4a" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="755" y="600" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="600">Treasury</text>
</svg>
