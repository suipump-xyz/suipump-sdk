<svg width="1200" height="290" viewBox="0 0 1200 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06040F"/>
      <stop offset="55%" stop-color="#0C0A1C"/>
      <stop offset="100%" stop-color="#080C1E"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1035"/>
    </linearGradient>
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E4A56"/>
      <stop offset="100%" stop-color="#061218"/>
    </linearGradient>
    <linearGradient id="node-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1A0A01"/>
    </linearGradient>
    <linearGradient id="node-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#052E16"/>
      <stop offset="100%" stop-color="#011108"/>
    </linearGradient>
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="82%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes flowdash { to{stroke-dashoffset:-18} }
    @keyframes shimmer { 0%,100%{opacity:.85} 50%{opacity:1} }
    @keyframes glow-pulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
    .n1{animation:pulse 3.2s ease-in-out infinite}
    .n2{animation:pulse 3.2s ease-in-out .65s infinite}
    .n3{animation:pulse 3.2s ease-in-out 1.3s infinite}
    .n4{animation:pulse 3.2s ease-in-out 1.95s infinite}
    .n5{animation:pulse 3.2s ease-in-out 2.6s infinite}
    .flow{stroke-dasharray:5 4;animation:flowdash 1.4s linear infinite}
    .logo{animation:shimmer 5s ease-in-out infinite}
    .glow-ring{animation:glow-pulse 2.5s ease-in-out infinite}
  </style>

  <!-- Base -->
  <rect width="1200" height="290" fill="url(#bg)"/>
  <rect width="1200" height="290" fill="url(#glow-l)"/>
  <rect width="1200" height="290" fill="url(#glow-r)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent-line)"/>

  <!-- Glow blob behind logo (soft, blurred) -->
  <ellipse cx="220" cy="145" rx="160" ry="80" fill="#7C3AED" opacity="0.06" filter="url(#blur-sm)"/>

  <!-- ====== LEFT: Text Content ====== -->

  <!-- Logo hex mark -->
  <g transform="translate(72, 135)">
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12"
             fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
    <polygon points="0,-13 11.3,-6.5 11.3,6.5 0,13 -11.3,6.5 -11.3,-6.5"
             fill="#3B1F7A" opacity="0.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#A78BFA"/>
    <line x1="0" y1="-13" x2="0" y2="-5" stroke="#A78BFA" stroke-width="1" opacity="0.6"/>
    <line x1="11.3" y1="-6.5" x2="5" y2="-2.5" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
    <line x1="11.3" y1="6.5" x2="5" y2="2.5" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="13" x2="0" y2="5" stroke="#A78BFA" stroke-width="1" opacity="0.6"/>
    <line x1="-11.3" y1="6.5" x2="-5" y2="2.5" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
    <line x1="-11.3" y1="-6.5" x2="-5" y2="-2.5" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- SuiPump wordmark -->
  <text x="116" y="108"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="68" font-weight="800" letter-spacing="-3"
        fill="url(#wordmark)" class="logo">SuiPump</text>

  <!-- SDK chip -->
  <rect x="117" y="116" width="76" height="26" rx="5" fill="#1A1035" stroke="#5B21B6" stroke-width="1"/>
  <text x="155" y="133"
        font-family="'SF Mono','Fira Code','Cascadia Code',monospace"
        font-size="12" font-weight="600" text-anchor="middle"
        fill="#A78BFA">@sdk/v1</text>

  <!-- Tagline -->
  <text x="117" y="165"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    Token Lifecycle Operating System · Built on Sui
  </text>

  <!-- Sub-line -->
  <text x="117" y="190"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="12" fill="#3D4A5C" letter-spacing="0.3">
    TypeScript · Walrus · Cetus CLMM · SuiNS · Enoki
  </text>

  <!-- Feature pills row -->
  <g transform="translate(117, 215)">
    <rect x="0" y="0" width="118" height="23" rx="11.5" fill="#120E24" stroke="#2D2350" stroke-width="0.8"/>
    <circle cx="16" cy="11.5" r="3.5" fill="#A78BFA"/>
    <text x="28" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#7C6AAB">2-Click Creation</text>

    <rect x="128" y="0" width="110" height="23" rx="11.5" fill="#0B1A1E" stroke="#153040" stroke-width="0.8"/>
    <circle cx="144" cy="11.5" r="3.5" fill="#22D3EE"/>
    <text x="156" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#4D9FAD">Unsigned PTBs</text>

    <rect x="248" y="0" width="118" height="23" rx="11.5" fill="#120E08" stroke="#2E2010" stroke-width="0.8"/>
    <circle cx="264" cy="11.5" r="3.5" fill="#F59E0B"/>
    <text x="276" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#9A7426">WS Streams</text>

    <rect x="376" y="0" width="108" height="23" rx="11.5" fill="#070F0D" stroke="#112018" stroke-width="0.8"/>
    <circle cx="392" cy="11.5" r="3.5" fill="#10B981"/>
    <text x="404" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#2D7A5E">Batch Buy</text>
  </g>

  <!-- ====== RIGHT: Lifecycle Visualization ====== -->

  <!-- Panel background -->
  <rect x="696" y="22" width="482" height="246" rx="12"
        fill="#09080F" stroke="#1A1730" stroke-width="1"/>
  <rect x="696" y="22" width="482" height="1.5" rx="1" fill="url(#accent-line)" opacity="0.5"/>

  <!-- Panel label -->
  <text x="937" y="46"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="9.5" text-anchor="middle" fill="#2E3A4A" letter-spacing="2">
    TOKEN LIFECYCLE
  </text>

  <!-- Flow lines between nodes -->
  <line x1="775" y1="145" x2="833" y2="145" stroke="url(#flow-line)" stroke-width="1.5" class="flow"/>
  <line x1="887" y1="145" x2="930" y2="145" stroke="url(#flow-line)" stroke-width="1.5" class="flow"/>
  <line x1="984" y1="145" x2="1027" y2="145" stroke="url(#flow-line)" stroke-width="1.5" class="flow"/>
  <line x1="1083" y1="145" x2="1121" y2="145" stroke="url(#flow-line)" stroke-width="1.5" class="flow"/>

  <!-- Stage 1: Discovery -->
  <g class="n1">
    <circle cx="745" cy="145" r="30" fill="url(#node-purple)" stroke="#4C1D95" stroke-width="1.5"/>
    <circle cx="745" cy="145" r="6" fill="#7C3AED"/>
    <circle cx="745" cy="145" r="3" fill="#C4B5FD"/>
    <text x="745" y="190" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#6D28D9">Discovery</text>
    <text x="745" y="205" font-family="'SF Mono',monospace" font-size="8.5" text-anchor="middle" fill="#2D2044">tokens.list()</text>
  </g>
  <text x="745" y="112" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle" fill="#2A1F4A">01</text>

  <!-- Stage 2: Creation -->
  <g class="n2">
    <circle cx="860" cy="145" r="30" fill="url(#node-purple)" stroke="#6D28D9" stroke-width="1.5"/>
    <line x1="860" y1="137" x2="860" y2="153" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="852" y1="145" x2="868" y2="145" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
    <text x="860" y="190" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#7C3AED">Creation</text>
    <text x="860" y="205" font-family="'SF Mono',monospace" font-size="8.5" text-anchor="middle" fill="#2D2044">OTW flow</text>
  </g>
  <text x="860" y="112" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle" fill="#2A1F4A">02</text>

  <!-- Stage 3: Bonding Curve -->
  <g class="n3">
    <circle cx="957" cy="145" r="30" fill="url(#node-cyan)" stroke="#0E7490" stroke-width="1.5"/>
    <path d="M947,151 Q951,135 957,138 Q963,141 968,134"
          fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    <text x="957" y="190" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#0891B2">Bonding</text>
    <text x="957" y="205" font-family="'SF Mono',monospace" font-size="8.5" text-anchor="middle" fill="#063A44">buy() sell()</text>
  </g>
  <text x="957" y="112" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle" fill="#0A3040">03</text>

  <!-- Stage 4: Graduation (golden, special) -->
  <g class="n4">
    <circle cx="1053" cy="145" r="36" fill="none" stroke="#F59E0B" stroke-width="0.8"
            opacity="0.35" class="glow-ring"/>
    <circle cx="1053" cy="145" r="30" fill="url(#node-amber)" stroke="#B45309" stroke-width="2"/>
    <polygon points="1053,135 1056.6,142.8 1065,142.8 1058.4,148.2 1061,156 1053,151 1045,156 1047.6,148.2 1041,142.8 1049.4,142.8"
             fill="#F59E0B" opacity="0.95"/>
    <text x="1053" y="190" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#D97706">Graduation</text>
    <text x="1053" y="205" font-family="'SF Mono',monospace" font-size="8.5" text-anchor="middle" fill="#3A1E02">→ Cetus</text>
  </g>
  <text x="1053" y="112" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle" fill="#3A2008">04</text>

  <!-- Stage 5: Post-Grad -->
  <g class="n5">
    <circle cx="1151" cy="145" r="30" fill="url(#node-green)" stroke="#047857" stroke-width="1.5"/>
    <path d="M1141,145 L1148,152 L1162,136"
          fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1151" y="190" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle" fill="#059669">Post-Grad</text>
    <text x="1151" y="205" font-family="'SF Mono',monospace" font-size="8.5" text-anchor="middle" fill="#042B1A">portfolio.*</text>
  </g>
  <text x="1151" y="112" font-family="'SF Mono',monospace" font-size="9" text-anchor="middle" fill="#032214">05</text>

  <!-- Bottom bar -->
  <rect x="0" y="287" width="1200" height="3" fill="url(#accent-line)" opacity="0.35"/>
</svg>