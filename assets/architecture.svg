    <text x="250" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">Unsigned Transactions</text>

    <rect x="400" y="36" width="155" height="48" rx="6" fill="#1A0828" stroke="#3A1060" stroke-width="0.8" class="card"/>
    <text x="420" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#C4B5FD">🔄 Event Indexer</text>
    <text x="420" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">gRPC Event Stream</text>

    <rect x="570" y="36" width="155" height="48" rx="6" fill="#1A0828" stroke="#3A1060" stroke-width="0.8" class="card"/>
    <text x="590" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#C4B5FD">📡 Stream Server</text>
    <text x="590" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">WebSocket · Real-time</text>

    <rect x="740" y="36" width="155" height="48" rx="6" fill="#1A0828" stroke="#3A1060" stroke-width="0.8" class="card"/>
    <text x="760" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#C4B5FD">🎓 Grad Watcher</text>
    <text x="760" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">Cetus Pool Trigger</text>

    <rect x="910" y="36" width="155" height="48" rx="6" fill="#1A0828" stroke="#3A1060" stroke-width="0.8" class="card"/>
    <text x="930" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#C4B5FD">⛽ Gas Sponsor</text>
    <text x="930" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">Enoki / sui-gas-station</text>

    <!-- Down arrow -->
    <line x1="600" y1="90" x2="600" y2="108" stroke="#A78BFA" stroke-width="1.5" class="arrow" opacity="0.7"/>
    <polygon points="596,106 600,114 604,106" fill="#A78BFA" opacity="0.7"/>
  </g>

  <!-- ====== LAYER 4: Blockchain ====== -->
  <g transform="translate(0, 414)">
    <rect x="40" y="0" width="1120" height="116" rx="8" fill="url(#layer-chain)" stroke="#0A2A2A" stroke-width="1"/>
    <rect x="40" y="0" width="1120" height="2.5" fill="#22D3EE" opacity="0.5"/>

    <text x="60" y="24" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#22D3EE">⛓️ SUI BLOCKCHAIN & ECOSYSTEM</text>

    <!-- Sui chain -->
    <rect x="60" y="36" width="185" height="64" rx="6" fill="#061A1A" stroke="#0D3D3D" stroke-width="0.8" class="card"/>
    <text x="80" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#22D3EE">⛓️ Sui Network</text>
    <text x="80" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#1A5A5A">13 Smart Contracts</text>
    <text x="80" y="85" font-family="'SF Mono',monospace" font-size="8" fill="#1A5A5A">Move · Object-Centric</text>

    <!-- Ecosystem cards -->
    <rect x="270" y="36" width="185" height="64" rx="6" fill="#0A1A0A" stroke="#0D3D1D" stroke-width="0.8" class="card"/>
    <text x="290" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#34D399">🌊 Walrus</text>
    <text x="290" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">Decentralized Blob Storage</text>
    <text x="290" y="85" font-family="'SF Mono',monospace" font-size="8" fill="#2A5A3A">Token Images · Metadata</text>

    <rect x="480" y="36" width="185" height="64" rx="6" fill="#1A0A05" stroke="#3D1D0A" stroke-width="0.8" class="card"/>
    <text x="500" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#F59E0B">🦀 Cetus CLMM</text>
    <text x="500" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A1A">Post-Graduation AMM</text>
    <text x="500" y="85" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A1A">LP Burn Verification</text>

    <rect x="690" y="36" width="185" height="64" rx="6" fill="#0A0A1A" stroke="#1A1A3D" stroke-width="0.8" class="card"/>
    <text x="710" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#818CF8">🔗 SuiNS</text>
    <text x="710" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#3A3A5A">Name Resolution</text>
    <text x="710" y="85" font-family="'SF Mono',monospace" font-size="8" fill="#3A3A5A">creator.sui Names</text>

    <rect x="900" y="36" width="185" height="64" rx="6" fill="#1A0A14" stroke="#3D1A2A" stroke-width="0.8" class="card"/>
    <text x="920" y="55" font-family="system-ui,sans-serif" font-size="10" fill="#F472B6">🔑 Enoki</text>
    <text x="920" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A4A">zkLogin · Gas Sponsorship</text>
    <text x="920" y="85" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A4A">Google Sign-In</text>

    <!-- Bottom bar -->
