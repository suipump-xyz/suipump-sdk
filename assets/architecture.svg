    <text x="80" y="71" font-family="'SF Mono',monospace" font-size="8" fill="#5A3A7A">Express · Rate-Limited</text>

    <rect x="230" y="36" width="155" height="48" rx="6" fill="#1A0828" stroke="#3A1060" stroke-width="0.8" class="card"/>
