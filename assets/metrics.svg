<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <style>
    <![CDATA[
    @keyframes growBar { 0%{width:0;opacity:0} 100%{opacity:1} }
    @keyframes countUp { 0%{opacity:0} 100%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
    .b1{animation:growBar .6s ease-out .1s forwards;width:0}
    .b2{animation:growBar .6s ease-out .2s forwards;width:0}
    .b3{animation:growBar .6s ease-out .3s forwards;width:0}
    .b4{animation:growBar .6s ease-out .4s forwards;width:0}
    .b5{animation:growBar .6s ease-out .5s forwards;width:0}
    .c1{animation:countUp .3s ease-out .7s forwards;opacity:0}
    .c2{animation:countUp .3s ease-out .8s forwards;opacity:0}
    .c3{animation:countUp .3s ease-out .9s forwards;opacity:0}
    .c4{animation:countUp .3s ease-out 1s forwards;opacity:0}
    .c5{animation:countUp .3s ease-out 1.1s forwards;opacity:0}
    .gl{animation:pulse 2.5s ease-in-out infinite}
    ]]>
  </style>

  <rect width="900" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="2.5" fill="url(#accent)" opacity="0.6"/>

  <text x="450" y="38" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="20" font-weight="700" fill="#10B981" letter-spacing="0.5">📈 SDK Metrics</text>
  <text x="450" y="56" text-anchor="middle"
        font-family="'SF Mono',monospace" font-size="10" fill="#4A5568">
    Live-verified from codebase · 2026-05-15</text>

  <!-- Bar chart area -->
  <g transform="translate(60, 80)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="260" stroke="#1A1A2A" stroke-width="1"/>
    <!-- Y-axis labels -->
    <text x="-8" y="264" text-anchor="end" font-family="'SF Mono',monospace" font-size="9" fill="#4A5568">0</text>
    <text x="-8" y="198" text-anchor="end" font-family="'SF Mono',monospace" font-size="9" fill="#4A5568">50</text>
    <text x="-8" y="132" text-anchor="end" font-family="'SF Mono',monospace" font-size="9" fill="#4A5568">100</text>
    <text x="-8" y="66" text-anchor="end" font-family="'SF Mono',monospace" font-size="9" fill="#4A5568">150</text>
    <text x="-8" y="16" text-anchor="end" font-family="'SF Mono',monospace" font-size="9" fill="#4A5568">200</text>

    <!-- Grid lines -->
    <line x1="0" y1="260" x2="780" y2="260" stroke="#1A1A2A" stroke-width="0.5"/>
    <line x1="0" y1="194" x2="780" y2="194" stroke="#1A1A2A" stroke-width="0.3" stroke-dasharray="4 4"/>
    <line x1="0" y1="128" x2="780" y2="128" stroke="#1A1A2A" stroke-width="0.3" stroke-dasharray="4 4"/>
    <line x1="0" y1="62" x2="780" y2="62" stroke="#1A1A2A" stroke-width="0.3" stroke-dasharray="4 4"/>
    <line x1="0" y1="12" x2="780" y2="12" stroke="#1A1A2A" stroke-width="0.3" stroke-dasharray="4 4"/>

    <!-- Bar 1: 13 Contracts -->
    <rect class="b1" x="30" y="241.8" height="18.2" fill="url(#bar1)" rx="3"/>
    <text class="c1" x="30" y="234" font-family="'SF Mono',monospace" font-size="11" fill="#10B981" font-weight="600">13</text>
    <text x="30" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">📜 Contracts</text>
    <text x="30" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#4A5568">.move modules</text>

    <!-- Bar 2: 186 Tests -->
    <rect class="b2" x="180" y="12" height="248" fill="url(#bar2)" rx="3"/>
    <text class="c2" x="180" y="8" font-family="'SF Mono',monospace" font-size="11" fill="#60A5FA" font-weight="600">186</text>
    <text x="180" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">🧪 Tests</text>
    <text x="180" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#4A5568">vitest suite</text>

    <!-- Bar 3: 8 SDK Modules -->
    <rect class="b3" x="330" y="254.8" height="5.2" fill="url(#bar3)" rx="3"/>
    <text class="c3" x="330" y="247" font-family="'SF Mono',monospace" font-size="11" fill="#C4B5FD" font-weight="600">8</text>
    <text x="330" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">📦 SDK Modules</text>
    <text x="330" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#4A5568">src/ files</text>

    <!-- Bar 4: 5 Sub-clients -->
    <rect class="b4" x="480" y="258" height="2" fill="url(#bar4)" rx="3"/>
    <text class="c4" x="480" y="247" font-family="'SF Mono',monospace" font-size="11" fill="#FBBF24" font-weight="600">5</text>
    <text x="480" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">🔌 Sub-Clients</text>
    <text x="480" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#4A5568">public API</text>

    <!-- Bar 5: 19 Types -->
    <rect class="b5" x="630" y="234" height="26" fill="url(#bar5)" rx="3"/>
    <text class="c5" x="630" y="227" font-family="'SF Mono',monospace" font-size="11" fill="#FBCFE8" font-weight="600">19</text>
    <text x="630" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">📋 Exported Types</text>
    <text x="630" y="305" text-anchor="middle" font-family="'SF Mono',monospace" font-size="8" fill="#4A5568">TypeScript interfaces</text>
  </g>

  <!-- Footer note -->
  <text x="450" y="380" text-anchor="middle"
        font-family="'SF Mono',monospace" font-size="8" fill="#3A3A4A">
    All counts verified by counting actual files and test blocks at build time</text>
</svg>