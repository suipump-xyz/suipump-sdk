<svg width="1200" height="290" viewBox="0 0 1200 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06040F"/>
      <stop offset="55%" stop-color="#0C0A1C"/>
      <stop offset="100%" stop-color="#080C1E"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2D2460" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-dot { 0%,100%{opacity:.6;r:4} 50%{opacity:1;r:5.5} }
    @keyframes pulse-line { 0%,100%{opacity:.35} 50%{opacity:.8} }
    @keyframes shimmer { 0%,100%{opacity:.85} 50%{opacity:1} }
    .dot1{animation:pulse-dot 3s ease-in-out infinite}
    .dot2{animation:pulse-dot 3s ease-in-out .5s infinite}
    .dot3{animation:pulse-dot 3s ease-in-out 1s infinite}
    .dot4{animation:pulse-dot 3s ease-in-out 1.5s infinite}
    .dot5{animation:pulse-dot 3s ease-in-out 2s infinite}
    .dot6{animation:pulse-dot 3s ease-in-out 2.5s infinite}
    .ln1{animation:pulse-line 3s ease-in-out infinite}
    .ln2{animation:pulse-line 3s ease-in-out .5s infinite}
    .ln3{animation:pulse-line 3s ease-in-out 1s infinite}
    .ln4{animation:pulse-line 3s ease-in-out 1.5s infinite}
    .ln5{animation:pulse-line 3s ease-in-out 2s infinite}
    .ln6{animation:pulse-line 3s ease-in-out 2.5s infinite}
    .logo{animation:shimmer 5s ease-in-out infinite}
  </style>

  <rect width="1200" height="290" fill="url(#bg)"/>
  <rect width="1200" height="290" fill="url(#glow-l)"/>

  <rect x="0" y="0" width="1200" height="2.5" fill="url(#accent-line)"/>

  <ellipse cx="220" cy="145" rx="160" ry="80" fill="#7C3AED" opacity="0.06" filter="url(#blur-sm)"/>

  <!-- Logo hex mark -->
  <g transform="translate(72, 135)">
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12"
             fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
    <polygon points="0,-13 11.3,-6.5 11.3,6.5 0,13 -11.3,6.5 -11.3,-6.5"
             fill="#3B1F7A" opacity="0.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#A78BFA"/>
    <line x1="0" y1="-13" x2="0" y2="-5" stroke="#A78BFA" stroke-width="1" opacity="0.6"/>
    <line x1="11.3" y1="-6.5" x2="5" y2="-2.5" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
    <line x1="11.3" y1="6.5" x2="5" y2="2.5" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="13" x2="0" y2="5" stroke="#A78BFA" stroke-width="1" opacity="0.6"/>
    <line x1="-11.3" y1="6.5" x2="-5" y2="2.5" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
    <line x1="-11.3" y1="-6.5" x2="-5" y2="-2.5" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
  </g>

  <text x="116" y="108"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="68" font-weight="800" letter-spacing="-3"
        fill="url(#wordmark)" class="logo">SuiPump</text>

  <text x="117" y="165"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
    Token Lifecycle Operating System · Built on Sui
  </text>

  <text x="117" y="190"
        font-family="'SF Mono','Fira Code',monospace"
        font-size="12" fill="#3D4A5C" letter-spacing="0.3">
    TypeScript · Walrus · Cetus CLMM · SuiNS · Enoki
  </text>

  <!-- Vertical divider -->
  <line x1="660" y1="30" x2="660" y2="258" stroke="url(#divider)" stroke-width="1"/>

  <!-- Feature pointers -->
  <g transform="translate(696, 52)">
    <text x="0" y="0"
          font-family="'SF Mono','Fira Code',monospace"
          font-size="9" fill="#2E3A4A" letter-spacing="2">PLATFORM FEATURES</text>

    <!-- Feature 1 -->
    <g class="ln1">
      <line x1="0" y1="30" x2="440" y2="30" stroke="#1A1730" stroke-width="0.5"/>
    </g>
    <circle cx="8" cy="30" r="4" fill="#A78BFA" class="dot1"/>
    <text x="24" y="35" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#C4B5FD">Secure zkLogin</text>
    <text x="24" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#4D3D70">Wallet-less onboarding via Google · Enoki</text>

    <!-- Feature 2 -->
    <g class="ln2">
      <line x1="0" y1="70" x2="440" y2="70" stroke="#1A1730" stroke-width="0.5"/>
    </g>
    <circle cx="8" cy="70" r="4" fill="#22D3EE" class="dot2"/>
    <text x="24" y="75" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#67E8F9">Unsigned PTBs</text>
    <text x="24" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#2D6070">Zero-trust · Backend builds, you sign</text>

    <!-- Feature 3 -->
    <g class="ln3">
      <line x1="0" y1="110" x2="440" y2="110" stroke="#1A1730" stroke-width="0.5"/>
    </g>
    <circle cx="8" cy="110" r="4" fill="#F59E0B" class="dot3"/>
    <text x="24" y="115" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FDE68A">2-Click Creation</text>
    <text x="24" y="136" font-family="system-ui,sans-serif" font-size="11" fill="#7A5420">OTW-based token deploy in two txns</text>

    <!-- Feature 4 -->
    <g class="ln4">
      <line x1="0" y1="150" x2="440" y2="150" stroke="#1A1730" stroke-width="0.5"/>
    </g>
    <circle cx="8" cy="150" r="4" fill="#10B981" class="dot4"/>
    <text x="24" y="155" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#A7F3D0">Real-Time Streams</text>
    <text x="24" y="176" font-family="system-ui,sans-serif" font-size="11" fill="#2D7A5E">WebSocket events · trades · graduations</text>

    <!-- Feature 5 -->
    <g class="ln5">
      <line x1="0" y1="190" x2="440" y2="190" stroke="#1A1730" stroke-width="0.5"/>
    </g>
    <circle cx="8" cy="190" r="4" fill="#F472B6" class="dot5"/>
    <text x="24" y="195" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FBCFE8">Atomic Batch Buy</text>
    <text x="24" y="216" font-family="system-ui,sans-serif" font-size="11" fill="#7A3A5A">Multi-token PTB · all-or-nothing</text>
  </g>

  <rect x="0" y="287" width="1200" height="3" fill="url(#accent-line)" opacity="0.35"/>
</svg>