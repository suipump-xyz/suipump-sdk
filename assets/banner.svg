    <polygon points="0,-40 34,-20 34,20 0,40 -34,20 -34,-20" fill="none" stroke="#4FD1C5" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="10" fill="#B794F4" filter="url(#glow)"/>
    <path d="M0,-10 L0,-60 M10,-5 L52,-30 M10,5 L52,30 M0,10 L0,60 M-10,5 L-52,30 M-10,-5 L-52,-30" stroke="#6B46C1" stroke-width="2" opacity="0.5"/>
