<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B794F4"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1000" height="250" fill="url(#bg)"/>
  
  <rect width="1000" height="4" fill="url(#textGrad)"/>
  
  <g transform="translate(80, 70)">
    <text x="0" y="40" font-family="sans-serif" font-size="56" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)">SuiPump</text>
    
    <rect x="250" y="5" width="80" height="30" rx="15" fill="#2D3748" stroke="#6B46C1" stroke-width="2"/>
    <text x="290" y="26" font-family="monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">@sdk/v1</text>
    
    <text x="0" y="85" font-family="sans-serif" font-size="20" fill="#E2E8F0">Token Lifecycle Operating System · Built on Sui</text>
    <text x="0" y="115" font-family="sans-serif" font-size="14" fill="#718096">TypeScript · Walrus · Cetus CLMM · SuiNS · Enoki</text>
    
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="#2D1B4E" />
      <circle cx="14" cy="14" r="4" fill="#9F7AEA"/>
      <text x="28" y="19" font-family="sans-serif" font-size="12" fill="#E2E8F0">2-Click Creation</text>
      
      <rect x="150" y="0" width="130" height="28" rx="14" fill="#0B2435" />
      <circle cx="164" cy="14" r="4" fill="#38B2AC"/>
      <text x="178" y="19" font-family="sans-serif" font-size="12" fill="#E2E8F0">Unsigned PTBs</text>

      <rect x="290" y="0" width="120" height="28" rx="14" fill="#3E2A0A" />
      <circle cx="304" cy="14" r="4" fill="#D69E2E"/>
      <text x="318" y="19" font-family="sans-serif" font-size="12" fill="#E2E8F0">WS Streams</text>

      <rect x="420" y="0" width="100" height="28" rx="14" fill="#0D331B" />
      <circle cx="434" cy="14" r="4" fill="#48BB78"/>
      <text x="448" y="19" font-family="sans-serif" font-size="12" fill="#E2E8F0">Batch Buy</text>
