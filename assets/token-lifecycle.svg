<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="step4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="step5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="url(#bg)" rx="12"/>

  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="1">Token Lifecycle</text>
  <line x1="150" y1="45" x2="750" y2="45" stroke="#334155" stroke-width="1"/>

  <!-- Step 1: Create -->
  <rect x="35" y="80" width="150" height="150" rx="12" fill="#1e1b4b" stroke="url(#step1)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="110" cy="115" r="20" fill="url(#step1)"/>
  <text x="110" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>
  <text x="110" y="150" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Create</text>
  <text x="110" y="167" text-anchor="middle" fill="#8b5cf6" font-size="10">2-Click OTW</text>
  <text x="110" y="182" text-anchor="middle" fill="#6d28d9" font-size="9">Publish package</text>
  <text x="110" y="195" text-anchor="middle" fill="#6d28d9" font-size="9">Mint + Bond</text>

  <!-- Arrow -->
  <line x1="185" y1="155" x2="215" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Bonding Curve -->
  <rect x="225" y="80" width="150" height="150" rx="12" fill="#0c1929" stroke="url(#step2)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="300" cy="115" r="20" fill="url(#step2)"/>
  <text x="300" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <text x="300" y="150" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">Launch</text>
  <text x="300" y="167" text-anchor="middle" fill="#22d3ee" font-size="10">Bonding Curve</text>
  <text x="300" y="182" text-anchor="middle" fill="#0891b2" font-size="9">Supply: 1B</text>
  <text x="300" y="195" text-anchor="middle" fill="#0891b2" font-size="9">Virtual Reserves</text>

  <!-- Bonding curve visual (arc) -->
  <path d="M240 210 Q300 170 360 210" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <line x1="375" y1="155" x2="405" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Trade -->
  <rect x="415" y="80" width="150" height="150" rx="12" fill="#022c22" stroke="url(#step3)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="490" cy="115" r="20" fill="url(#step3)"/>
  <text x="490" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>
  <text x="490" y="150" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="700">Trade</text>
  <text x="490" y="167" text-anchor="middle" fill="#34d399" font-size="10">Buy / Sell</text>
  <text x="490" y="182" text-anchor="middle" fill="#059669" font-size="9">Price increases</text>
  <text x="490" y="195" text-anchor="middle" fill="#059669" font-size="9">with demand</text>

  <!-- Arrow -->
  <line x1="565" y1="155" x2="595" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Graduate -->
  <rect x="605" y="80" width="150" height="150" rx="12" fill="#1c1917" stroke="url(#step4)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="680" cy="115" r="20" fill="url(#step4)"/>
  <text x="680" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">4</text>
  <text x="680" y="150" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">Graduate</text>
  <text x="680" y="167" text-anchor="middle" fill="#f59e0b" font-size="10">Threshold met</text>
  <text x="680" y="182" text-anchor="middle" fill="#d97706" font-size="9">Liquidity locked</text>
  <text x="680" y="195" text-anchor="middle" fill="#d97706" font-size="9">LP burn verified</text>

  <!-- Arrow -->
  <line x1="755" y1="155" x2="785" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Cetus -->
  <rect x="795" y="80" width="75" height="150" rx="12" fill="#1f1315" stroke="url(#step5)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="832" cy="115" r="20" fill="url(#step5)"/>
  <text x="832" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">5</text>
  <text x="832" y="150" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">Cetus</text>
  <text x="832" y="167" text-anchor="middle" fill="#f87171" font-size="9">CLMM</text>
  <text x="832" y="182" text-anchor="middle" fill="#ef4444" font-size="9">Pool</text>

  <!-- Bottom: Stats bar -->
  <rect x="35" y="270" width="835" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="295" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">KEY METRICS</text>

  <text x="130" y="325" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">12 Modules</text>
  <text x="130" y="345" text-anchor="middle" fill="#64748b" font-size="10">Deployed Contracts</text>

  <text x="300" y="325" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">1B Supply</text>
  <text x="300" y="345" text-anchor="middle" fill="#64748b" font-size="10">Per Token</text>

  <text x="470" y="325" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">4,200 SUI</text>
  <text x="470" y="345" text-anchor="middle" fill="#64748b" font-size="10">Graduation Threshold</text>

  <text x="640" y="325" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">~75 Tests</text>
  <text x="640" y="345" text-anchor="middle" fill="#64748b" font-size="10">Move Contract Tests</text>

  <text x="790" y="325" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">95%+</text>
  <text x="790" y="345" text-anchor="middle" fill="#64748b" font-size="10">Test Coverage</text>
</svg>
